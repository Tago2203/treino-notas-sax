<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Treino de Notas - Sax</title>
<meta name="theme-color" content="#e07a3f" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<main id="screen-menu">
  <h1>🎷 Treino de Notas</h1>
  <p class="subtitle">Leitura de partitura na clave de sol</p>
  <div id="level-list"></div>
</main>

<main id="screen-settings" hidden>
  <div class="hud">
    <button id="settings-back-btn" class="icon-btn" aria-label="Voltar">←</button>
    <span id="settings-level-name"></span>
  </div>

  <div class="settings-block">
    <p class="settings-label">Modo de jogo</p>
    <div id="mode-toggles" class="chip-list"></div>
  </div>

  <div class="settings-block" id="speed-block">
    <label class="settings-label" for="speed-range">Velocidade: <b id="speed-value"></b> px/s</label>
    <input type="range" id="speed-range" min="25" max="220" step="5" />
  </div>

  <div class="settings-block" id="spacing-block">
    <label class="settings-label" for="spacing-range">Espaçamento entre notas: <b id="spacing-value"></b> s</label>
    <input type="range" id="spacing-range" min="0.6" max="4" step="0.1" />
  </div>

  <div class="settings-block">
    <p class="settings-label">Notas que podem aparecer</p>
    <div id="note-toggles" class="note-toggle-list"></div>
  </div>

  <div class="settings-block">
    <p class="settings-label">Oitavas</p>
    <div id="octave-toggles" class="chip-list"></div>
  </div>

  <div class="settings-block">
    <p class="settings-label">Figuras rítmicas que podem passar</p>
    <div id="duration-toggles" class="chip-list"></div>
  </div>

  <div class="settings-block">
    <label class="chip">
      <input type="checkbox" id="accidentals-check" />
      Incluir sustenidos (♯) e bemóis (♭)
    </label>
  </div>

  <p id="settings-warning" class="settings-warning" hidden>Selecione pelo menos uma nota, uma oitava e uma figura rítmica.</p>

  <button id="start-btn" class="start-btn">Iniciar ▶</button>
</main>

<main id="screen-game" hidden>
  <div class="hud">
    <button id="back-btn" class="icon-btn" aria-label="Voltar">←</button>
    <span id="level-name"></span>
    <span class="hud-stat">Pontos: <b id="score">0</b></span>
    <span class="hud-stat">Sequência: <b id="streak">0</b></span>
  </div>
  <canvas id="staff"></canvas>
  <div id="options"></div>
</main>

<script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
<script src="https://surikov.github.io/webaudiofontdata/sound/0650_Aspirin_sf2_file.js"></script>
<script type="module" src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
